approach_planner:
  ros__parameters:
    base_frame: "geometric_unicycle"
    costmap_topic_name: "/global_costmap/costmap_raw"
    contours_topic_name: "/surface_detector/results"
    goal_topic_name: "/approach_planner/goal_pose"
    robot_radius: 0.2
    # Goals are placed at robot_radius + goal_edge_margin from the surface contour
    goal_edge_margin: 0.05
    max_costmap_val: 253
    dist_threshold: 0.6
    # The goal minimizes: distance from the object + goal_robot_distance_weight * distance from the robot
    goal_robot_distance_weight: 0.25

    # Optional: both hands must be over the surface at the goal, at least hand_surface_margin inside its contour.
    # Off: the arms are fixed to the base, so they do not limit where the base can stand.
    # Offsets from the base frame, they must match the object_detector parameters with the same names.
    enable_hands_over_surface_check: false
    hand_forward_offset: 0.3
    hand_lateral_offset: 0.3
    hand_surface_margin: 0.05

    # Orientation shaping (toggle + tuning)
    enable_window_tangent_orientation: true
    orientation_window_size: 2
    orientation_object_weight: 0.7
    orientation_contour_normal_weight: 0.3
    orientation_face_tolerance_deg: 40.0
    orientation_perp_tolerance_deg: 40.0

    # Goal footprint clearance check: no lethal/unknown cell within this radius from the goal.
    # If radius is -1, it is computed from robot_radius / costmap_resolution.
    enable_goal_clearance_check: true
    goal_clearance_radius_cells: -1
